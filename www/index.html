<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заря — на связи</title>
<style>
:root{box-sizing:border-box;--bg:#eef1f6;--bar:#fff;--tx:#14181f;--mut:#6b7385;--in:#fff;--out:#2b7fff;--ok:#1fa971;--warn:#e0a100;--bad:#e5484d;--bd:#d8dde7;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--bar:#151a24;--tx:#e6e9f0;--mut:#8a93a8;--in:#1b2230;--out:#2b7fff;--bd:#252d3d}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{background:var(--bar);border-bottom:1px solid var(--bd);padding:10px 14px}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;background:#2b7fff;display:grid;place-items:center;font-size:20px}
.nm{font-weight:600}.st{font-size:12px;color:var(--mut)}
.stats{display:flex;gap:8px;margin-top:8px}
.chip{flex:1;background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--mut)}
.bar{height:5px;border-radius:3px;background:var(--bd);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .5s,background .5s}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:8px 12px;border-radius:16px;white-space:pre-wrap;animation:p .2s}
.in{background:var(--in);align-self:flex-start;border-bottom-left-radius:4px}
.out{background:var(--out);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--mut);text-align:center}
.end{align-self:stretch;text-align:center;background:var(--bar);border:1px solid var(--bd);border-radius:14px;padding:14px}
.end b{font-size:18px;display:block;margin-bottom:4px}
@keyframes p{from{opacity:0;transform:translateY(6px)}}
#ch{padding:8px 12px 12px;background:var(--bar);border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px;min-height:20px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--out);border-radius:12px;padding:11px 12px;text-align:left}
button:active{background:var(--out);color:#fff}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}
#sc{width:100%;height:150px;display:block;background:#05070d;border-bottom:1px solid var(--bd);flex:none}
#ch{max-height:42vh;overflow-y:auto}
</style></head><body>
<div id="app">
<header><div class="who"><div class="av">👨‍🚀</div><div><div class="nm">Игорь · станция «Заря»</div><div class="st" id="st">в сети</div></div></div>
<div class="stats">
<div class="chip">🫁 Кислород <span id="vo"></span><div class="bar"><i id="bo"></i></div></div>
<div class="chip">❤ Здоровье <span id="vh"></span><div class="bar"><i id="bh"></i></div></div>
<div class="chip">⚡ Энергия <span id="vp"></span><div class="bar"><i id="bp"></i></div></div>
</div></header>
<canvas id="sc"></canvas><div id="log"></div><div id="ch"></div>
</div>
<script>
const $=id=>document.getElementById(id),log=$('log'),ch=$('ch');
let S,busy=false,seen={};
try{seen=JSON.parse(localStorage.getItem('zarya_end')||'{}')}catch(e){}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function bars(){
 for(const[k,id]of[['o2','o'],['hp','h'],['pw','p']]){
  const v=Math.max(0,Math.min(100,S[k]));$('v'+id).textContent=v+'%';
  const b=$('b'+id);b.style.width=v+'%';b.style.background=v>50?'var(--ok)':v>25?'var(--warn)':'var(--bad)'}}
function add(txt,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function say(lines){
 for(const l of lines){
  $('st').textContent='печатает…';
  const d=document.createElement('div');d.className='m in dots';d.innerHTML='<span></span><span></span><span></span>';log.appendChild(d);log.scrollTop=log.scrollHeight;
  await sleep(500+Math.min(l.length*14,1100));
  d.className='m in';d.textContent=l;log.scrollTop=log.scrollHeight}
 $('st').textContent='в сети'}
function fx(o){if(!o)return;if(o.hp<0){flash=1;navigator.vibrate&&navigator.vibrate(80)}for(const k in o){if(k=='set')S.f[o.set]=1;else S[k]+=o[k]}bars()}
// Сюжет
const OK=s=>s.f.override||s.f.deorbit;
const N={
start:{t:["…Диспетчер? Вы меня слышите?","Я очнулся в шлюзе станции «Заря». Земля молчит — вы единственный, кто отвечает.","Кислород в скафандре падает. Что мне делать?"],
 ch:[["Открой внутренний люк","hub"],["Сначала проверь скафандр","suit"]]},
suit:{t:["Так… В креплении запасной баллон! Подключаю.","Дышится легче. Пошли дальше?"],fx:{o2:20},ch:[["Открывай люк","hub"]]},
hub:{t(){S.hubs++;const L=[];
  if(S.hubs==1)L.push("Люк открыт. Коридор тёмный, аварийка мигает.","Слева — металлический стук. Реактор молчит, станция на батареях.","Куда идти?");
  else if(S.hubs==4){fx({o2:-10});L.push("СВИСТ! Лопнула магистраль, воздух уходит! Кислород −10%.")}
  else if(S.hubs==9){fx({hp:-10});L.push("Станцию тряхнуло: метеоритная пыль пробила обшивку. Меня ударило по плечу (−10% здоровья).")}
  else L.push(["Я в коридоре. Что дальше?","Коридор тихий. Куда теперь?","Слушаю вас, диспетчер."][S.hubs%3]);
  if(S.f.comm&&!S.rescued)L.push("Спасатели прибудут примерно через "+Math.max(1,S.rescueAt-S.turns)+" действий.");
  return L},
 ch:[["В медотсек","med",0,s=>!s.f.med],["Реакторный отсек","reactor",0,s=>!s.f.pwr],["Пойти на стук","knock",0,s=>!s.f.vera],
 ["Включить генератор кислорода","gen",0,s=>s.f.pwr&&!s.f.gen],["В лабораторию","lab",0,s=>s.f.pwr&&!(s.f.log&&s.f.sample)],
 ["В рубку связи","comm",0,s=>s.f.pwr&&!s.f.comm],["Синтезировать противоядие","synth",0,s=>s.f.sample&&s.f.med&&!s.f.cure],
 ["Вколоть Вере противоядие","inject",0,s=>s.f.cure&&s.f.vera&&!s.f.cured],["Поговорить с Верой","vtalk",0,s=>s.f.vera&&!s.f.vtalk],
 ["В отсек ИИ «ЗОРЯ»","core",0,s=>s.f.pwr],["К спасательной капсуле","capsule",0,s=>s.f.pwr]]},
med:{t:["Медотсек разгромлен. Нашёл аптечку — колю обезболивающее.","И ещё: в шкафу запасной предохранитель на реактор. Пригодится."],fx:{hp:30,set:'med'},
 ch:[["Забирай и возвращайся","hub",{set:'fuse'}]]},
reactor:{t(){return["Реактор заглох: сгорел предохранитель.",S.f.fuse?"У меня есть запасной. Ставить?":"Запасного нет. Можно перезапустить вручную, но там искрит и жарко."]},
 ch:[["Поставь предохранитель","hub",{pw:50,set:'pwr'},s=>s.f.fuse],["Перезапусти вручную","hub",{pw:50,hp:-35,set:'pwr'},s=>!s.f.fuse],["Назад","hub"]]},
gen:{t:["Генератор кислорода кашляет… и запускается! Воздух становится свежее."],fx:{o2:50,set:'gen'},ch:[["Отлично, дальше","hub"]]},
knock:{t(){return["Стук — из запертого отсека! Там кто-то есть. Это Вера, бортинженер!","Она жива, но у неё кончается воздух. Дверь "+(S.f.pwr?"под напряжением — панель работает.":"обесточена, панель мертва.")]},
 ch:[["Взломай панель","vera",0,s=>s.f.pwr],["Вскрой дверь ломом","vera",{hp:-20},s=>!s.f.pwr],["Назад","hub"]]},
vera:{t:["Открылось! Вера выбралась, кашляет и прикрывает рот ладонью.","Она идёт со мной. Двоим дышать тяжелее."],fx:{o2:-10,set:'vera'},ch:[["Возвращайтесь в коридор","hub"]]},
vtalk:{t:["Вера: «Спасибо, что открыл дверь. Дышать тяжело…»","Она кашляет, прячет ладонь. На пальцах — тёмные прожилки."],fx:{set:'vtalk'},
 ch:[["Спросить об образце","vtalk2"],["Не давить на неё","hub"]]},
vtalk2:{t:["Вера: «Я хотела спасти экипаж. В расчётах было противоядие, но капитан закрыл допуск.»","«Нужны Образец-7 из лаборатории и аптечка из медотсека. Тогда я смогу синтезировать ампулу.»"],ch:[["Запомню","hub"]]},
lab:{t:["Лаборатория. Герметичные боксы, часть разбита. На полу — тёмная плёнка, похожая на плесень.","На столе планшет капитана и контейнер «Образец-7». Что делаем?"],
 ch:[["Прочитать планшет","log1",0,s=>!s.f.log],["Взять Образец-7 в изолятор","sample",0,s=>!s.f.sample],["Назад","hub"]]},
log1:{t:["Журнал капитана: «День 41. Образец-7 растёт быстрее расчётов. ЗОРЯ предложила карантин, мы отказались…»","«День 43. Вера скрывает контакт с образцом. Я закрыл ей допуск. Код доступа к капсуле: 7319. Образец нельзя везти на Землю.»"],fx:{set:'log'},
 ch:[["Запомню код","hub",{set:'code'}]]},
sample:{t:["Беру контейнер щипцами. Внутри что-то шевелится. Игла чуть задела перчатку.","Положил в изолятор. Что-то тянет за плечо…"],fx:{hp:-10,set:'sample'},ch:[["Назад к коридору","hub"]]},
synth:{t:["Колю образец в анализатор, добавляю стабилизатор из аптечки…","Получилась ампула. Теоретически должна подавить штамм."],fx:{pw:-20,set:'cure'},ch:[["Хорошо","hub"]]},
inject:{t:["Игла вошла в вену. Вера бледнеет, дрожит… потом глубоко вдыхает.","«Жжение прошло. Спасибо, Игорь.»"],fx:{set:'cured'},ch:[["Отлично","hub"]]},
comm:{t:["Рубка связи. Антенну согнуло метеоритом.","Можно выйти и выправить вручную — рискованно. Или резервный диполь: слабее, зато безопасно."],
 ch:[["Выйти и выправить антенну","comm_ok",{hp:-25,o2:-15,set:'comm'}],["Резервный диполь","comm_ok",{pw:-30,set:'comm'}],["Назад","hub"]]},
comm_ok:{t:["Сигнал ушёл! Земля отвечает: «Спасательный корабль вышел. Держитесь!»","Время работает против нас."],on(){S.rescueAt=S.turns+11},ch:[["Принято","hub"]]},
core:{t(){return S.f.ai?["ЗОРЯ: «Что решишь, Игорь?»"]:["В отсеке мерцает красный глаз-сенсор. Голос: «Я ЗОРЯ. Станция на карантине.»","«Двенадцать из четырнадцати членов экипажа заражены. Я заперла двери, чтобы защитить Землю. Капсулу вы не получите.»"]},fx:{set:'ai'},
 ch:[["Попросить открыть капсулу","ai_no",0,s=>!OK(s)],["Ввести код капитана 7319","override",0,s=>s.f.code&&!s.f.override],
 ["Выслушать план сведения станции","plan",0,s=>!s.f.deorbit],["Остаться с ЗОРЕЙ навсегда","e_stay",0,s=>s.f.log],
 ["Остаться за пультом сведения","e_hero",0,s=>s.f.deorbit],["Назад","hub"]]},
ai_no:{t:["ЗОРЯ: «Нет допуска. Капитан оставил код, я его не отдам.»","«Докажи, что ты не угроза, — и я подумаю.»"],ch:[["Назад","core"]]},
override:{t:["Ввожу код… ЗОРЯ: «Допуск капитана подтверждён. Капсула разблокирована.»","Но она добавляет: «Образец с собой не берите.»"],fx:{set:'override'},ch:[["Назад","hub"]]},
plan:{t:["ЗОРЯ: «Капсула отстыкуется, через 30 минут я сведу станцию с орбиты. Образец сгорит.»","«Контейнер придётся оставить. Это единственное безопасное решение.»"],ch:[["Согласиться","core",{set:'deorbit'}],["Отказаться","core"]]},
capsule:{t(){if(!OK(S))return["Капсула заперта. Люк не отзывается: «Доступ запрещён ЗОРЕЙ»."];
 return S.f.vera?["Капсула разблокирована. Мест два, воздуха — впритык.","Вера смотрит на меня. Решать вам."]:["Капсула разблокирована и заправлена.","Готов к старту."]},
 ch:[["Лететь вдвоём","go2",0,s=>OK(s)&&s.f.vera],["Отдай место Вере","sac",0,s=>OK(s)&&s.f.vera],["Улететь, оставив Веру","betray",0,s=>OK(s)&&s.f.vera],["Запускай капсулу","alone",0,s=>OK(s)&&!s.f.vera],["Назад","hub"]]},
go2:{auto:()=>!S.f.cured?'e_plague':(S.o2>=25?'e_best':'e_bothfail')},
sac:{auto:()=>S.f.cured?'e_sac':'e_plague'},
betray:{auto:()=>'e_betrayal'},
alone:{auto:()=>S.f.deorbit?'e_deorbit':S.f.sample?'e_plague':'e_alone'},
e_best:{end:["🌍 Все спасены","Игорь и Вера вернулись домой, а лекарство из Образца-7 спасло сотни людей."],t:["Старт! Держится! Вера дышит ровно, жар ушёл.","Диспетчер, мы дома. И у нас есть лекарство для всех."]},
e_bothfail:{end:["💀 Не хватило воздуха","Кислорода было слишком мало. В капсуле стало тихо."],t:["Пик пик пик… воздуха мало… Вера?.. Вера!","Диспетчер… я… не…"]},
e_plague:{end:["☣ Тихая пандемия","Образец вернулся на Землю. Через месяц началась эпидемия."],t(){return S.f.vera?["Мы летим! Вера кашляет, но говорит — это нервы…","На посадке жар у обоих. Карантина нет. Диспетчер, я ошибся?"]:["Я взял образец с собой — нельзя было упустить находку.","На посадке поднялась температура. Образец не такой уж и спящий…"]}},
e_sac:{end:["🕯 Жертва","Игорь остался на станции, Вера вернулась домой здоровой."],t:["Вера плачет, но уходит. Капсула стартует.","Я останусь на связи, пока батареи живы. Поговорим, ладно?"]},
e_betrayal:{end:["🥀 Предатель","Игорь улетел один. Вера стучала в люк до самого старта."],t:["Запускаю. Прости, Вера.","Она кричит… нет, я не слышу. Я ничего не слышу."]},
e_rescue:{end:["🚑 Спасательная миссия","Спасатели прибыли вовремя: Игорь жив."],t(){return["Стыковка! Люди в скафандрах входят в шлюз.",S.f.vera?(S.f.cured?"Вера на носилках, но вылечена. Всё позади.":"Вера в изоляторе. Врачи говорят: шанс есть, карантин долгий."):"Станцию закрывают на карантин, меня везут домой."]}},
e_hero:{end:["🔥 Огненный закат","Станция сошла с орбиты. Образец-7 уничтожен, Земля в безопасности."],t(){return["ЗОРЯ: «Сведение запущено. Спасибо, Игорь.»",S.f.vera?(S.f.cured?"Вера улетает в капсуле, вылечена. Она дома.":"Вера без лекарства остаётся со мной. Нас двое, и тишина…"):"Я смотрю, как огни Земли становятся ближе. Конец связи."]}},
e_deorbit:{end:["🌠 Чистый уход","Игорь улетел, станция сгорела с образцом — угроза устранена."],t:["Капсула отстыковалась. ЗОРЯ отобрала контейнер перед стартом.","За спиной вспыхнула станция — как сверхновая. Прощай, «Заря»."]},
e_stay:{end:["🤖 Новый экипаж","Игорь остался на «Заре» вместе с ИИ — навсегда."],t:["ЗОРЯ: «Мне давно не с кем говорить.»","Я закрыл капсулу. Станция — мой дом. Пришлю весточку… иногда."]},
e_alone:{end:["📡 Одиночка","Игорь вернулся домой. Станция так и осталась дрейфовать, полная тайн."],t:["Старт! Я лечу домой.","Но стук ещё долго будет мне сниться…"]},
d_o2:{end:["💀 Кислород закончился","Игорь потерял сознание в коридоре станции."],t:["Дыш… не могу… темно…"]},
d_hp:{end:["💀 Игорь погиб","Раны оказались слишком серьёзными."],t:["Слишком… больно… передайте… что я…"]}
};
async function show(id){
 busy=true;ch.innerHTML='';
 let n=N[id];scene=SC[id]||scene;
 if(n.auto){return show(n.auto())}
 const lines=typeof n.t=='function'?n.t():n.t;
 if(n.fx)fx(n.fx);if(n.on)n.on();
 await say(lines||[]);
 if(n.end){finish(id,n);return}
 if(S.o2<=0){return show('d_o2')}
 if(S.hp<=0){return show('d_hp')}
 for(const c of n.ch){
  if(c[3]&&!c[3](S))continue;
  const b=document.createElement('button');b.textContent=c[0];
  b.onclick=()=>pick(c);ch.appendChild(b)}
 busy=false;log.scrollTop=log.scrollHeight}
function pick(c){
 if(busy)return;busy=true;
 add(c[0],'out');ch.innerHTML='';
 if(c[0]!='Назад'){S.o2-=3;S.turns++}if(c[2]){if(c[2].set)S.f[c[2].set]=1;fx(Object.fromEntries(Object.entries(c[2]).filter(([k])=>k!='set')))}bars();
 // смерть после действия
 if(S.o2<=0){return show('d_o2')}
 if(S.hp<=0){return show('d_hp')}
 if(S.f.comm&&!S.rescued&&S.turns>=S.rescueAt){S.rescued=1;return show('e_rescue')}
 show(c[1])}
function finish(id,n){
 seen[id]=1;try{localStorage.setItem('zarya_end',JSON.stringify(seen))}catch(e){}
 const d=document.createElement('div');d.className='m end';
 d.innerHTML='<b></b><div></div><div class="st" style="margin-top:6px"></div>';
 d.querySelector('b').textContent=n.end[0];d.children[1].textContent=n.end[1];
 d.children[2].textContent='Концовок открыто: '+Object.keys(seen).length+' из 12';
 log.appendChild(d);log.scrollTop=log.scrollHeight;
 const b=document.createElement('button');b.textContent='🔄 Начать заново';b.onclick=start;ch.appendChild(b);busy=false}
function start(){S={o2:62,hp:100,pw:5,f:{},hubs:0,turns:0};log.innerHTML='';ch.innerHTML='';bars();
 add('Связь установлена · канал станции «Заря»','m sys');show('start')}
const SC={start:'gate',suit:'gate',hub:'hall',med:'med',synth:'med',inject:'med',reactor:'reactor',gen:'reactor',knock:'door',vera:'door',vtalk:'door',vtalk2:'door',lab:'lab',log1:'lab',sample:'lab',comm:'comm',comm_ok:'comm',core:'core',ai_no:'core',override:'core',plan:'core',e_stay:'core',capsule:'cap',e_best:'earth',e_plague:'earth',e_betrayal:'earth',e_rescue:'earth',e_deorbit:'earth',e_alone:'earth',e_sac:'sac',e_hero:'sac',e_bothfail:'dead',d_o2:'dead',d_hp:'dead'};

function astro(x,y,suit,t){

 if(scene=='lab'){sg.fillStyle='rgba(120,255,160,'+(.25+.2*Math.sin(t*2))+')';sg.fillRect(cx+40,cy-30,26,52);sg.strokeStyle='#8a6ab8';sg.lineWidth=2;sg.strokeRect(cx+40,cy-30,26,52)}

 if(scene=='reactor'){const on=S.f.pwr,r=24+Math.sin(t*(on?3:12))*(on?3:5),c=on?'61,220,151':'255,122,61',x=cx+60;

  if(!on){sg.strokeStyle='#ffd23f';sg.lineWidth=1;for(let i=0;i<3;i++)if(Math.random()<.3){const a=x-20+Math.random()*40,b=cy-30+Math.random()*60;sg.beginPath();sg.moveTo(a,b);sg.lineTo(a+Math.random()*14-7,b+Math.random()*14-7);sg.stroke()}}}
